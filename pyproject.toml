[project]
name = "maa-planner"
version = "0.1.0"
description = "Generate maa-cli task configs from Skland account data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.4.0",
    "skland-api @ file:///Users/nemo/skland-api",
    "tomlkit>=0.13.3",
]

[project.scripts]
maa-planner = "maa_planner:main"

[build-system]
requires = ["uv_build>=0.7.8,<0.8.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ty>=0.0.39",
]
