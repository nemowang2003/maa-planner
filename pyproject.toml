[project]
name = "maa-planner"
version = "0.1.0"
description = "Plan tasks for maa-cli and manage MAA Windows desktop updates"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.4.0",
    "psutil>=7.2.2",
    "skland-api @ file:///Users/nemo/skland-api",
    "tomlkit>=0.13.3",
]

[project.scripts]
maa_cli_planner = "maa_cli_planner:main"
maa_desktop_planner = "maa_desktop_planner.cli:main"

[build-system]
requires = ["uv_build>=0.7.8,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["maa_cli_planner", "maa_desktop_planner"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ty>=0.0.39",
]
