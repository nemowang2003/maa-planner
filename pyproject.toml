[project]
name = "maa-planner"
version = "0.1.0"
description = "Plan and run native MaaCore tasks with a multi-account daemon"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5,<4",
    "httpx>=0.28,<1",
    "pillow==12.2.0",
    "platformdirs>=4.4.0",
    "psutil>=7.2.2",
    "python-engineio>=4.15.1,<5",
    "python-socketio[asyncio-client]>=5.18.1,<6",
    "skland-api",
    "tenacity>=9.1,<10",
    "tzdata>=2026.6",
    "watchdog>=7.0.0",
]

[project.scripts]
maa-planner = "maa_planner:main"
maa-planner-wecom-client = "maa_planner.interfaces.wecom:main"
maa-planner-serverchan-client = "maa_planner.interfaces.serverchan:main"

[build-system]
requires = ["uv_build>=0.7.8,<0.8.0"]
build-backend = "uv_build"

[tool.uv.sources]
skland-api = { path = "../skland-api" }

[tool.uv.build-backend]
module-name = "maa_planner"
source-include = ["docs/example.toml"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
testpaths = ["tests/schema", "tests/daemon", "tests/interfaces"]
addopts = "--strict-markers"
markers = ["native: exercises real operating-system adapters; run on each supported test host"]
